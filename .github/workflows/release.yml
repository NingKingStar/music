name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '已推送的版本标签，例如 v0.9.7；只生成发布草稿'
        required: true
        type: string

jobs:
  # 安卓双渠道签名 APK：ubuntu 构建，产物经 artifact 交给 release 汇总
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          # Gradle 依赖与 wrapper 缓存：跳过每次冷启动的全量下载
          cache: 'gradle'

      - name: Extract version from tag
        id: version
        run: |
          TAG="$RELEASE_TAG"
          VERSION=${TAG#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          CONFIG_VERSION=$(sed -n 's/^versionName=//p' release.properties | tr -d '\r')
          VERSION_CODE=$(sed -n 's/^versionCode=//p' release.properties | tr -d '\r')
          test "$VERSION" = "$CONFIG_VERSION" || { echo "标签与正式版本配置不一致"; exit 1; }
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] || exit 1
          test "$VERSION_CODE" -ge 100131 || exit 1
          echo "code=$VERSION_CODE" >> $GITHUB_OUTPUT
        env:
          RELEASE_TAG: ${{ inputs.tag }}

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ${{ github.workspace }}/muses-release.keystore

      # 签名与版本号经 AGP injected properties 注入：
      # versionName=tag；versionCode=release.properties 显式配置（发版时递增）
      # 双渠道一条命令构建：共享配置阶段与 compile 任务，较两次独立构建显著提速
      - name: Build signed APKs (muses + miui)
        run: |
          chmod +x gradlew
          VERSION_CODE=${{ steps.version.outputs.code }}
          ./gradlew :app:assembleMusesRelease :app:assembleMiuiRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/muses-release.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }} \
            -Pandroid.injected.versionName=${{ steps.version.outputs.version }} \
            -Pandroid.injected.versionCode=$VERSION_CODE \
            -PdiagnosticCommit=$(git rev-parse HEAD)

      - name: Rename muses APK
        run: |
          mv app/build/outputs/apk/muses/release/app-muses-release.apk              muses-v${{ steps.version.outputs.version }}.apk

      - name: Rename miui APK
        run: |
          mv app/build/outputs/apk/miui/release/app-miui-release.apk              muses-v${{ steps.version.outputs.version }}-mi.apk

      - name: 核验签名并生成校验值
        run: |
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          for APK in muses-v*.apk; do
            "$BT/apksigner" verify --verbose --print-certs "$APK" | tee signature.txt
            grep -qi '442377d8ec4a56b9794dd36e1e2f8768d764f83280506e0d86371f71eb8fda7d' signature.txt
            "$BT/zipalign" -c -P 16 4 "$APK"
          done
          sha256sum muses-v*.apk > SHA256SUMS.txt

      # 说明由安卓 job 生成（有 checkout 可读 changelog）；MSI 文件名是确定性的
      - name: Read changelog
        run: |
          CHANGELOG_FILE="changelog/v${{ steps.version.outputs.version }}.md"
          if [ -f "$CHANGELOG_FILE" ]; then
            cat "$CHANGELOG_FILE" >> release_body.md
          else
            echo "> 暂无更新日志" >> release_body.md
          fi
          echo "---" >> release_body.md
          echo "" >> release_body.md
          echo "### 构建产物" >> release_body.md
          echo "- \`muses-v${{ steps.version.outputs.version }}.apk\` — 安卓端（Compose Multiplatform 双端共享界面，包名 \`com.muses.player\`）" >> release_body.md
          echo "- \`muses-v${{ steps.version.outputs.version }}-mi.apk\` — 安卓端 MIUI 定制包（包名 \`com.miui.player\`）" >> release_body.md
          echo "- \`Muses-v${{ steps.version.outputs.version }}.msi\` — Windows 桌面端（构建成功后补充）" >> release_body.md

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: muses-android
          path: |
            muses-v${{ steps.version.outputs.version }}.apk
            muses-v${{ steps.version.outputs.version }}-mi.apk
            release_body.md
            SHA256SUMS.txt

  # Windows 桌面端 MSI（Compose Multiplatform / jpackage），与安卓并行
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      # 内置播放引擎：VLC 3.0.21 win64 官方包（GPL 系，随包分发义务见 docs/THIRD_PARTY.md）。
      # 经 MUSES_VLC_ZIP 交给 scripts/prepare-vlc-runtime.ps1 解压 + 按 scripts/vlc-trim-keep.txt
      # 裁成纯音频最小集（182MB → 约 40MB）后进 jpackage 的 app/resources/vlc，
      # 让安装版免装 VLC 桌面版即可播放。
      #
      # 用 curl.exe 而非 Invoke-WebRequest：v0.6.4 首次发版实测 IWR 在 runner 上 1.8s 就返回了
      # 一份小文件（get.videolan.org 302 到 mirror-hk 后内容被换掉），SHA256 校验直接失败；
      # 本机对照测试 curl.exe 完全正确。--fail 保证 HTTP 4xx/5xx 非零退出，不会把错误页当 zip 存下。
      - name: Cache VLC zip
        id: vlc-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vlc-3.0.21-win64.zip
          key: vlc-3.0.21-win64.zip-a0b7ec02b50adf64

      - name: Download VLC runtime
        shell: pwsh
        run: |
          $url = "https://get.videolan.org/vlc/3.0.21/win64/vlc-3.0.21-win64.zip"
          $out = "$env:RUNNER_TEMP\vlc-3.0.21-win64.zip"
          $expected = "a0b7ec02b50adf6417eed014fb8df50af39690505a4225b85b3dc2ed17d14843"

          # 缓存命中（或上一次残留）：校验通过则直接用，省一次 74MB 下载
          if (Test-Path $out) {
            $h = (Get-FileHash $out -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($h -eq $expected) {
              Write-Host "VLC 包命中缓存：$out"
              "MUSES_VLC_ZIP=$out" >> $env:GITHUB_ENV
              exit 0
            }
            Write-Host "缓存文件校验不过（hash=$h），丢弃重下"
            Remove-Item $out -Force
          }

          $ok = $false
          foreach ($attempt in 1..3) {
            curl.exe -L --fail --silent --show-error --retry 2 --retry-delay 5 -o $out $url
            if ($LASTEXITCODE -ne 0) {
              Write-Host "curl 失败（第 $attempt 次，exit=$LASTEXITCODE）"
              Start-Sleep -Seconds 5
              continue
            }
            $size = (Get-Item $out).Length
            $hash = (Get-FileHash $out -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($hash -eq $expected) {
              Write-Host "VLC 包就绪：$out（$size 字节）"
              $ok = $true
              break
            }
            # 失败时打印可诊断信息（大小 + 头部），下次再挂能一眼看出是不是错误页
            $head = (Get-Content $out -TotalCount 1 -ErrorAction SilentlyContinue)
            Write-Host "校验失败（第 $attempt 次）：size=$size hash=$hash head=$($head -replace '\s+',' ' | Select-Object -First 1)"
            Remove-Item $out -Force
            Start-Sleep -Seconds 5
          }
          if (-not $ok) { throw "VLC 包 SHA256 校验多次未通过（见上方 size/hash/head）" }
          "MUSES_VLC_ZIP=$out" >> $env:GITHUB_ENV

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $TAG = $env:RELEASE_TAG
          $VERSION = $TAG -replace '^v', ''
          "version=$VERSION" >> $env:GITHUB_OUTPUT
          "tag=$TAG" >> $env:GITHUB_OUTPUT
        env:
          RELEASE_TAG: ${{ inputs.tag }}

      # jpackage 需完整 JDK（含 jpackage.exe）：javaHome 经 MUSES_DESKTOP_JDK 指向
      # runner 的 JDK（setup-java 已导出 JAVA_HOME），本机硬编码路径仅作本地回落；
      # MSI 版本经 -Pmuses.desktop.version 注入（v0.4.10 → 0.4.10）；
      # -P 参数必须加引号：pwsh 会把 -P 开头解析为自己的参数，不加引号点号后的部分
      # 会被 Gradle 误认为任务名（Task '.desktop.version=x' not found）
      - name: Package Windows MSI
        shell: pwsh
        run: |
          $env:MUSES_DESKTOP_JDK = $env:JAVA_HOME
          ./gradlew.bat :composeApp:packageMsi "-Pmuses.desktop.version=${{ steps.version.outputs.version }}"

      # 内置 VLC 缺失时 prepareVlcRuntime 只告警不失败（本地无 VLC 源也能构建）：
      # 发版必须拦住，否则发布出去的就是用户报「未找到 VLC 播放引擎」的那个包
      - name: Verify bundled VLC
        shell: pwsh
        run: |
          $dll = "composeApp/build/appResources/windows/vlc/libvlc.dll"
          if (-not (Test-Path $dll)) { throw "内置 VLC 未产出：$dll（检查 MUSES_VLC_ZIP 与 scripts/vlc-trim.ps1）" }
          $size = (Get-ChildItem "composeApp/build/appResources/windows/vlc" -Recurse -File | Measure-Object Length -Sum).Sum
          Write-Host ("内置 VLC 校验通过：{0:N1} MB" -f ($size / 1MB))

      # 通配符定位产物：输出目录随 CMP 版本可能是 main/ 或 main-release/，
      # 覆盖两种变体，找不到即显式失败
      - name: Rename MSI
        shell: pwsh
        run: |
          $msi = Get-ChildItem "composeApp/build/compose/binaries/*/msi/*.msi" | Select-Object -First 1
          if (-not $msi) { throw "未找到 MSI 产物" }
          Move-Item $msi.FullName "Muses-v${{ steps.version.outputs.version }}.msi"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: muses-windows
          path: Muses-v${{ steps.version.outputs.version }}.msi

  # 安卓构建成功先准备草稿；Windows 失败不阻塞 APK 下载附件。
  release:
    needs: [build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      # ref_name 已含 v 前缀（v0.5.2），标题直接用，不再拼 v
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: ${{ inputs.tag }}
          tag_name: ${{ inputs.tag }}
          body_path: release-assets/muses-android/release_body.md
          fail_on_unmatched_files: true
          files: |
            release-assets/**/*.apk
            release-assets/**/SHA256SUMS.txt

  release-windows:
    needs: [build-windows, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: muses-windows
          path: windows-assets
      - name: 补充 Windows 附件，保留现有发布状态
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release upload "$RELEASE_TAG" windows-assets/*.msi --repo "$GITHUB_REPOSITORY"
