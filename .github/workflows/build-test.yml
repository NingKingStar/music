name: Build Test APK

# 手动触发的测试构建：只上传 artifact 供装机验证，不创建 GitHub Release、不打 tag。
# 正式发版仍走 release.yml（tag 触发）。
on:
  workflow_dispatch:

jobs:
  build-test-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ${{ github.workspace }}/muses-release.keystore

      # P1 KMP 纯度门禁（任务 09-04-kmp-p1-common R5）：commonMain 混入平台 API 即红
      - name: KMP common purity gate
        run: |
          chmod +x gradlew
          ./gradlew :core:common:compileKotlinJvm :core:common:allTests

      # 与 release.yml 同一签名密钥，可与正式版互相覆盖安装；
      # versionName 标注 test 后缀避免与正式版混淆，versionCode 用提交总数保持单调递增
      - name: Build signed APKs (muses + miui)
        run: |
          chmod +x gradlew
          VERSION_CODE=$(sed -n 's/^versionCode=//p' release.properties | tr -d '\r')
          VERSION_NAME=$(sed -n 's/^versionName=//p' release.properties | tr -d '\r')
          ./gradlew :app:assembleMusesRelease :app:assembleMiuiRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/muses-release.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }} \
            -Pandroid.injected.versionName=$VERSION_NAME-test \
            -Pandroid.injected.versionCode=$VERSION_CODE \
            -PdiagnosticCommit=$GITHUB_SHA

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: muses-test-apks
          path: |
            app/build/outputs/apk/muses/release/app-muses-release.apk
            app/build/outputs/apk/miui/release/app-miui-release.apk
          retention-days: 7
